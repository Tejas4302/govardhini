<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <title>Govardhini</title>
    <!-- (your other meta tags & PWA icons here) -->

    <style>
      /* 1. Make html/body/root fill exactly the viewport */
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow-x: hidden; /* no sideways scroll */
      }

      /* 2. Enable vertical scroll when needed */
      body,
      #root {
        overflow-y: auto;
      }

      /* 3. Safe-area insets for notches */
      body {
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
        box-sizing: border-box;
      }

      /* 4. Prevent iOS font zoom in inputs */
      input,
      select,
      textarea {
        font-size: 16px !important;
      }

      /* 5. Force Tailwind container classes full-width */
      .container {
        max-width: 100% !important;
        width: 100% !important;
        margin-left: 0 !important;
        margin-right: 0 !important;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
